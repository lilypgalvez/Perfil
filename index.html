    body { font-family: 'DM Sans', sans-serif; }

    .hero-overlay { background: linear-gradient(135deg, rgba(2,6,23,0.92), rgba(0,40,60,0.8)); }
    .timeline-line { position: relative; padding-left: 2rem; border-left: 2px solid #0e7490; }
    .timeline-line::before { content: ''; position: absolute; left: -6px; top: 0.5rem; width: 10px; height: 10px; border-radius: 50%; background: #06b6d4; box-shadow: 0 0 8px #06b6d4, 0 0 16px rgba(6,182,212,0.4); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100% { box-shadow: 0 0 8px #06b6d4, 0 0 16px rgba(6,182,212,0.4); } 50% { box-shadow: 0 0 14px #06b6d4, 0 0 28px rgba(6,182,212,0.6); } }
    @keyframes fadeUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
    .anim-hidden { opacity: 0; transform: translateY(30px); }
    .anim-show { animation: fadeUp 0.6s ease forwards; }
    .skill-tag { transition: all 0.3s ease; }
    .skill-tag:hover { transform: translateY(-2px); box-shadow: 0 0 12px rgba(6,182,212,0.5); }
    @keyframes glow-border { 0%,100% { border-color: #06b6d4; } 50% { border-color: #22d3ee; } }
    .contact-card { border: 1px solid #06b6d4; animation: glow-border 3s infinite; }

  <script>
    lucide.createIcons();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          entry.target.style.animationDelay = '0.1s';
          entry.target.classList.remove('anim-hidden');
          entry.target.classList.add('anim-show');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.anim-hidden').forEach(el => observer.observe(el));
  </script>
